# Baut Kiezkönig bei jedem Push auf den Standard-Branch und veröffentlicht es als Web-App auf GitHub Pages.
# Einmalig nötig: im Repo unter Settings → Pages bei „Source“ den Punkt „GitHub Actions“ wählen.
name: Web-App veröffentlichen

on:
  push:
    branches: [claude/cloud-sessions-overview-ymqajx]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
