<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#16121f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kiezkönig">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="./icons/icon-192.png">
<title>Kiezkönig</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap">
</head>
<body>
<main id="app">
  <section class="screen" id="screen-menu">
    <div class="logo">
      <p class="tag">Debug-Build</p>
      <h1>KIEZ<br>KÖNIG</h1>
    </div>
    <nav class="menu">
      <button class="btn primary" id="btn-play" type="button">Spielen</button>
      <button class="btn" id="btn-settings" type="button">Einstellungen</button>
      <button class="btn" id="btn-debug" type="button">Debug-Info</button>
    </nav>
    <p class="version" id="version"></p>
  </section>

  <section class="screen" id="screen-play" hidden>
    <header class="hud-top wood">
      <span class="stat"><img data-icon="money"><span id="hud-money"></span></span>
      <span class="stat"><img data-icon="clock"><span id="hud-time"></span></span>
      <span class="stat"><img data-icon="star"><span id="hud-rating"></span></span>
      <button class="hud-menu" data-back type="button" aria-label="Zurück zum Hauptmenü">Menü</button>
    </header>
    <div class="room-area">
      <div class="room-scroll" id="room-scroll"><canvas id="room"></canvas></div>
      <p class="stock-warning" id="hud-stock" hidden><img data-icon="stock"><span></span></p>
    </div>

    <nav class="hud-bottom wood">
      <button class="sign" data-panel="lager" type="button"><img data-icon="lager"><span>Lager</span></button>
      <button class="sign" data-panel="preise" type="button"><img data-icon="preise"><span>Preise</span></button>
      <button class="sign" data-panel="bauen" type="button"><img data-icon="bauen"><span>Bauen</span></button>
      <button class="sign" data-panel="kiez" type="button"><img data-icon="kiez"><span>Kiez</span></button>
    </nav>

    <div class="panel-backdrop" id="panel" hidden>
      <section class="panel wood" role="dialog" aria-modal="true" aria-labelledby="panel-title">
        <div class="panel-paper">
          <h3 id="panel-title"></h3>
          <p id="panel-text"></p>
        </div>
        <button class="sign sign-wide" id="panel-close" type="button"><span>Schließen</span></button>
      </section>
    </div>
  </section>

  <section class="screen" id="screen-settings" hidden>
    <h2>Einstellungen</h2>
    <label class="row"><span>Sound</span><input type="checkbox" id="opt-sound" checked></label>
    <label class="row"><span>Musik</span><input type="checkbox" id="opt-music" checked></label>
    <button class="btn" data-back type="button">Zurück</button>
  </section>

  <section class="screen" id="screen-debug" hidden>
    <h2>Debug-Info</h2>
    <dl class="info" id="debug-info"></dl>
    <button class="btn" data-back type="button">Zurück</button>
  </section>
</main>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
